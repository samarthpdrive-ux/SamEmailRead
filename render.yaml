services:
  - type: web
    name: outlook-mail-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 app:app
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_PATH
        value: data/outlook_api.db
      - key: ADMIN_API_KEY
        sync: false
      - key: APP_ENCRYPTION_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
